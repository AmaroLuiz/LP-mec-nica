    <link rel="stylesheet" href="_ds/carros-e09b9798-1e5d-41e6-97a0-d5619d50d27e/tokens/colors.css">

    <link rel="stylesheet" href="_ds/carros-e09b9798-1e5d-41e6-97a0-d5619d50d27e/tokens/spacing.css">
    <link rel="stylesheet" href="_ds/carros-e09b9798-1e5d-41e6-97a0-d5619d50d27e/tokens/radius.css">

    <style>
        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--color-primary);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden
        }

        a {
            color: var(--color-text-primary);
            text-decoration: none
        }

        a:hover {
            color: var(--color-accent)
        }

        .wrap {
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 clamp(20px, 4vw, 48px)
        }

        .sec {
            padding: clamp(64px, 9vw, 128px) 0
        }

        .grid-2,
        .grid-3,
        .grid-4 {
            display: grid;
            gap: clamp(16px, 2.4vw, 24px)
        }

        .grid-2 {
            grid-template-columns: 1fr
        }

        .grid-3 {
            grid-template-columns: 1fr
        }

        .grid-4 {
            grid-template-columns: 1fr
        }

        .hero-grid {
            display: grid;
            gap: clamp(28px, 4vw, 56px);
            grid-template-columns: 1fr;
            align-items: center
        }

        .hero-media {
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-atmos-lg)
        }

        .hud {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: clamp(32px, 5vw, 56px);
            position: relative;
            z-index: 2
        }

        .about-grid,
        .form-grid,
        .faq-grid {
            display: grid;
            gap: clamp(28px, 4vw, 64px);
            grid-template-columns: 1fr;
            align-items: center
        }

        .form-row {
            display: grid;
            gap: var(--space-4);
            grid-template-columns: 1fr
        }

        .cta-final {
            display: grid;
            gap: clamp(24px, 3vw, 48px);
            padding: clamp(28px, 5vw, 64px);
            align-items: center;
            grid-template-columns: 1fr
        }

        .foot {
            display: grid;
            gap: var(--space-8);
            grid-template-columns: 1fr
        }

        .navlink {
            font-size: var(--text-caption);
            font-weight: 500;
            letter-spacing: var(--tracking-label);
            text-transform: uppercase;
            color: var(--color-text-secondary);
            transition: color var(--duration-normal) var(--ease-standard)
        }

        .navlink:hover {
            color: var(--color-text-primary)
        }

        .navlinks,
        .navphone,
        .navcta {
            display: none !important
        }

        .navburger {
            display: inline-flex !important
        }

        .marquee {
            display: flex;
            width: 100%
        }

        .marquee-track {
            display: inline-flex;
            align-items: center;
            gap: clamp(28px, 5vw, 64px);
            white-space: nowrap;
            animation: slide 38s linear infinite;
            will-change: transform
        }

        @keyframes slide {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(-50%)
            }
        }

        .wa-float {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 70;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 18px;
            border-radius: 999px;
            background: var(--color-accent);
            color: #fff;
            box-shadow: 0 12px 30px var(--color-accent-glow);
            transition: transform var(--duration-fast) var(--ease-premium)
        }

        .wa-float:hover {
            transform: translateY(-2px);
            color: #fff
        }

        .cat-card {
            display: block
        }

        image-slot {
            display: block
        }

        @media(min-width:640px) {
            .form-row {
                grid-template-columns: 1fr 1fr
            }

            .grid-2,
            .grid-3 {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .grid-4 {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .hud {
                grid-template-columns: repeat(4, minmax(0, 1fr))
            }

            .foot {
                grid-template-columns: 2fr 1fr 1fr
            }
        }

        @media(min-width:1000px) {

            .navlinks,
            .navphone,
            .navcta {
                display: flex !important
            }

            .navburger {
                display: none !important
            }

            .grid-3 {
                grid-template-columns: repeat(3, minmax(0, 1fr))
            }

            .grid-4 {
                grid-template-columns: repeat(4, minmax(0, 1fr))
            }

            .hero-grid {
                grid-template-columns: 1.05fr 1fr
            }

            .about-grid {
                grid-template-columns: 1fr 1fr
            }

            .form-grid {
                grid-template-columns: .85fr 1fr
            }

            .faq-grid {
                grid-template-columns: .7fr 1fr;
                align-items: start
            }

            .cta-final {
                grid-template-columns: 1fr auto
            }

            .hud {
                margin-bottom: -56px
            }

            .about-media {
                margin-top: -96px
            }
        }

        @media(max-width:767px) {
            .marquee-track {
                animation-duration: 26s
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .marquee-track {
                animation: none
            }
        }
    </style>
</head>
